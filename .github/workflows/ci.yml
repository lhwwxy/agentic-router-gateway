name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: JS core (golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: js

  gateway:
    name: new-api gateway (e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: gateway

  python:
    name: Python core (golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: python

  go:
    name: Go core (golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      # 只测 core（纯标准库）；main.go 的 Higress wasm 依赖需要额外环境
      - run: go test ./core/... -v
        working-directory: go

  wasm-build:
    name: Higress Wasm plugin build (TinyGo)
    runs-on: ubuntu-latest
    continue-on-error: true # 占位依赖版本可能漂移，构建问题在 PR 里跟进
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: |
          wget -q https://github.com/tinygo-org/tinygo/releases/download/v0.32.0/tinygo_0.32.0_amd64.deb
          sudo dpkg -i tinygo_0.32.0_amd64.deb
      - run: |
          cd go
          go mod tidy
          tinygo build -o plugin.wasm -target=wasi ./
